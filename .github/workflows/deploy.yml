name: Deploy

# Deploys to the Hostinger VPS on every push to main, after the exact same
# typecheck/build gate as ci.yml — a red build never reaches the VPS.
# Three apps live on this VPS: server/ (port 3000, the webhook/OAuth
# paths on the main domain), dashboard/ (port 3100, everything else on
# the main domain), and admin/ (port 3200, served at the /admin path on
# the same domain, never linked from the customer-facing apps) — see
# docs/HOSTINGER_VPS_SETUP.md
# for the nginx routing and one-time server setup this depends on (the
# deploy path already git cloned, Node + PM2 installed, the deploy
# user's public key already in the runner's known VPS).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server, dashboard, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # See ci.yml for why admin/'s build needs these — placeholder values
    # only, just enough to satisfy lib/env.ts's schema during `next build`.
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SERVER_ENV_PATH: ../server/.env
      DASHBOARD_ENV_PATH: ../dashboard/.env
      SERVER_HEALTH_URL: http://127.0.0.1:3000/health
      SESSION_COOKIE_NAME: cardping_admin_session
      SESSION_TTL_HOURS: "168"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main

            cd server
            npm ci
            npm run build
            npm prune --omit=dev
            pm2 startOrReload ecosystem.config.js --update-env

            cd ../dashboard
            npm ci
            npm run build
            npm prune --omit=dev
            pm2 startOrReload ecosystem.config.js --update-env

            cd ../admin
            npm ci
            npm run build
            npm prune --omit=dev
            pm2 startOrReload ecosystem.config.js --update-env

            pm2 save
